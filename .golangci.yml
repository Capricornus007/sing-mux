version: "2"
run:
  go: "1.25"
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - paralleltest
    - ineffassign
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000 # package comment (never enforced on this fork)
        - -ST1003 # ALL_CAPS naming (legacy constant names)
        - -ST1016 # consistent method receiver names
        - -ST1020 # exported function comment
        - -ST1021 # exported type comment
        - -ST1022 # exported variable comment
        - -ST1023 # exported function return comment
        - -SA1019 # deprecated symbol use (sing deprecations not yet migrated)
        - -QF1001 # De Morgan's law
        - -QF1008 # remove embedded field from selector
